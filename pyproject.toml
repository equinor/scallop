[project]
name = "scallop-dev"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "numpy>=2.4.6,<3",
  "torch>=2.15,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
