[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scallop-codeql"
version = "0.0.1"
dependencies = ["pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."scallop.plugin"]
gpt = "scallop_codeql:ScallopCodeQLPlugin"
