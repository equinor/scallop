[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scallop-transformers"
version = "0.0.2"
dependencies = [
  "opencv-python",
  "pillow",
  "torch",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."scallop.plugin"]
transformers = "scallop_transformers:ScallopTransformersPlugin"
