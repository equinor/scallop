[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scallop-opencv"
version = "0.0.2"
dependencies = [
  "numpy",
  "opencv-python",
  "pillow",
  "requests",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."scallop.plugin"]
opencv = "scallop_opencv:ScallopOpenCVPlugin"
