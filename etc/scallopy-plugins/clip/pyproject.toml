[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scallop-clip"
version = "0.0.1"
dependencies = [
  "clip @ git+https://github.com/openai/CLIP.git",
  "pillow",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."scallop.plugin"]
clip = "scallop_clip:ScallopCLIPPlugin"
