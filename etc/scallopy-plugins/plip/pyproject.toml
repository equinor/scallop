[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scallop-plip"
version = "0.0.2"
dependencies = [
  "pillow",
  "torch",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."scallop.plugin"]
plip = "scallop_plip:ScallopPLIPPlugin"
