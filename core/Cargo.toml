[package]
name = "scallop-core"
version = "0.2.5"
authors = ["Ziyang Li <liby99@icloud.com>"]
edition.workspace = true

[lib]
crate-type = ["rlib"]

[build-dependencies]
lalrpop = { version = "0.23.2", features = ["lexer"] }

[dependencies]
lalrpop-util = { version = "0.23.2", features = ["lexer"] }
itertools = "0.15"
colored = "3.1"
annotate-snippets = "0.12"
petgraph = "0.8"
indexmap = "2"
csv = "1.1"
sprs = "0.11"
jiff = { version = "1", default-features = false, features = ["std", "js"] }
num-bigint = "0.5"
ordered-float = "5"
regex = "1"
dyn-clone = "1.0.10"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.10.1", features = ["std_rng", "alloc"] }
astnode-derive = { path = "../lib/astnode-derive" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
oxidd = { version = "0.13.0", default-features = false, features = ["bcdd", "manager-index", "apply-cache-direct-mapped"] }

[target.'cfg(target_family = "wasm")'.dependencies]
rsdd = { git = "https://github.com/neuppl/rsdd", rev = "168a6b4bf8c60176a2575fb1158342c4f6da9077" }
