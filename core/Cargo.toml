[package]
name = "scallop-core"
version = "0.2.5"
authors = ["Ziyang Li <liby99@icloud.com>"]
edition = "2021"

[lib]
crate-type = ["rlib"]

[build-dependencies]
lalrpop = { version = "0.23.1", features = ["lexer"] }

[dependencies]
lalrpop-util = { version = "0.23.1", features = ["lexer"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
downcast = "0.11"
quote = "1.0"
syn = "2.0"
paste = "1.0"
itertools = "0.15"
colored = "3.1"
petgraph = "0.8"
csv = "1.1"
sprs = "0.11"
jiff = { version = "1", default-features = false, features = ["std", "js"] }
num-bigint = "0.4"
regex = "1"
dyn-clone = "1.0.10"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.10.1", features = ["std_rng", "alloc"] }
astnode-derive = { path = "../lib/astnode-derive" }
sdd = { path = "../lib/sdd" }
