name: Scallopy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Scallopy tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install CPU PyTorch
        run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
      - name: Build and install Scallopy
        run: uv pip install --config-setting build-args=--locked ./etc/scallopy
      - name: Test
        run: uv run --active --no-project python etc/scallopy/tests/test.py
