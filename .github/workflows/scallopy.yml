name: Scallopy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build Scallopy wheels
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.build.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .github/python-versions
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: cargo-wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/python-versions', '.github/workflows/scallopy.yml') }}
          restore-keys: cargo-wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: python-wheel-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/python-versions', '.github/workflows/scallopy.yml') }}
      - name: Build wheels
        id: build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          interpreters=()
          while IFS= read -r version; do
            interpreter=$(command -v "python$version")
            interpreters+=("$interpreter")
          done < .github/python-versions
          uvx maturin@1.16.0 build --release --locked --compatibility linux \
            --manifest-path etc/scallopy/Cargo.toml --out dist/wheels \
            --interpreter "${interpreters[@]}"
          echo "python-versions=$(jq -Rnc '[inputs]' < .github/python-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scallopy-linux-wheels
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-and-test:
    name: Scallopy tests (Python ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.build-wheels.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: python-tests-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('.github/workflows/scallopy.yml') }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: scallopy-linux-wheels
          path: dist/wheels
      - name: Install test dependencies and Scallopy wheel
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv venv --python "$(command -v python)"
          uv pip install "numpy>=2.4.6,<3"
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          uv pip install --no-index --find-links dist/wheels scallopy
      - name: Test
        run: uv run --no-project python etc/scallopy/tests/test.py
